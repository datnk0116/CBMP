name: CBMP tests

on:
  push:
    branches:
      - main
      - fix/assignment2-compliance
  pull_request:
    branches:
      - main
      - fix/assignment2-compliance
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate benchmark datasets
        run: python scripts/check_datasets.py

      - name: Run automated tests
        run: python -m pytest -q -m "not slow"
